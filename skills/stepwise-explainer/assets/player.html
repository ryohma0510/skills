<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>図解</title>
  <style>
    :root {
      --bg: #eef1f7;
      --surface: #fff;
      --text: #1c2430;
      --muted: #5c6777;
      --line: #d5dce8;
      --tab: #e8edf6;
      --el-a: #d5dee8;
      --el-a-ink: #314354;
      --el-b: #ddd8e4;
      --el-b-ink: #433c4f;
      --el-c: #d5e0d9;
      --el-c-ink: #31463c;
      --warn: #7a6248;
      --danger: #7a4e4a;
      --tag-before: #e6d9d6;
      --callout-fix-bg: #f3eeec;
      --callout-note-bg: #f2eee8;
      --code-bg: #1e2430;
      --code-text: #e8edf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 16px/1.6 system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .top {
      padding: 20px 20px 12px;
      max-width: 960px;
      margin: 0 auto;
    }

    .top h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      max-width: 960px;
      margin: 0 auto;
      background: var(--bg);
      overflow-x: auto;
    }

    .tabs button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--tab);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      cursor: pointer;
    }

    .tabs button.is-seen {
      color: var(--text);
      background: var(--surface);
    }

    .tabs button.is-current {
      color: var(--el-a-ink);
      background: var(--el-a);
      border-color: color-mix(in srgb, var(--el-a-ink) 28%, var(--el-a));
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 20px 96px;
    }

    .step {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
    }

    .step > *:first-child { margin-top: 0; }
    .step > *:last-child { margin-bottom: 0; }

    .lead { font-size: 1.05rem; }

    .flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
    }

    .flow .arrow {
      color: var(--muted);
      font-size: 1.2rem;
    }

    .chip {
      display: inline-block;
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 600;
      border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
    }

    .el-a { background: var(--el-a); color: var(--el-a-ink); }
    .el-b { background: var(--el-b); color: var(--el-b-ink); }
    .el-c { background: var(--el-c); color: var(--el-c-ink); }

    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: var(--bg);
    }

    .tag-before,
    .tag-after {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 8px;
    }

    .tag-before { background: var(--tag-before); color: var(--danger); }
    .tag-after { background: var(--el-c); color: var(--el-c-ink); }

    pre.code {
      margin: 12px 0;
      padding: 12px 14px;
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: 8px;
      overflow-x: auto;
      font: 13px/1.5 ui-monospace, monospace;
    }

    .tok-a { color: #9db4c9; }
    .tok-b { color: #b5adc4; }
    .tok-c { color: #a3b8aa; }

    .callout-fix,
    .callout-note {
      border-radius: 8px;
      padding: 12px 12px 12px 14px;
      margin: 12px 0;
    }

    .callout-fix {
      border-left: 4px solid var(--danger);
      background: var(--callout-fix-bg);
    }

    .callout-note {
      border-left: 4px solid var(--warn);
      background: var(--callout-note-bg);
    }

    .rules {
      margin: 0;
      padding-left: 1.2em;
    }

    .rules li { margin: 6px 0; }

    .demo {
      margin-top: 16px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    .demo label {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    .pager {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: rgba(238, 241, 247, 0.95);
      border-top: 1px solid var(--line);
    }

    .pager button {
      min-width: 96px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
    }

    .pager button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #pos { color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 800px) {
      .pair { grid-template-columns: 1fr; }
      .flow { flex-direction: column; align-items: stretch; }
      .flow .arrow { transform: rotate(90deg); text-align: center; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1 id="doc-title">題</h1>
  </header>
  <nav class="tabs" id="tabs" aria-label="ステップ"></nav>
  <main>
    <div id="panels">
      <!-- section.step を必要な数だけ置く。data-title がタブの文言。最初の section は全体像。 -->
    </div>
  </main>
  <footer class="pager">
    <button type="button" id="prev">前へ</button>
    <span id="pos"></span>
    <button type="button" id="next">次へ</button>
  </footer>
  <script>
    (function () {
      var panels = document.getElementById("panels");
      var tabsEl = document.getElementById("tabs");
      var prev = document.getElementById("prev");
      var next = document.getElementById("next");
      var pos = document.getElementById("pos");
      var steps = [].slice.call(panels.querySelectorAll("section.step"));
      var index = 0;

      function show(i) {
        if (!steps.length) return;
        index = Math.max(0, Math.min(i, steps.length - 1));
        steps.forEach(function (step, n) {
          var on = n === index;
          step.hidden = !on;
          var tab = tabsEl.children[n];
          if (!tab) return;
          tab.classList.toggle("is-current", on);
          if (on) tab.classList.add("is-seen");
          tab.setAttribute("aria-selected", on ? "true" : "false");
        });
        prev.disabled = index === 0;
        next.disabled = index === steps.length - 1;
        pos.textContent = index + 1 + " / " + steps.length;
      }

      steps.forEach(function (step, n) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = step.getAttribute("data-title") || String(n + 1);
        btn.setAttribute("role", "tab");
        btn.addEventListener("click", function () { show(n); });
        tabsEl.appendChild(btn);
      });

      prev.addEventListener("click", function () { show(index - 1); });
      next.addEventListener("click", function () { show(index + 1); });

      document.addEventListener("keydown", function (event) {
        var tag = event.target && event.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (event.key === "ArrowLeft") show(index - 1);
        if (event.key === "ArrowRight") show(index + 1);
      });

      show(0);
    })();
  </script>
</body>
</html>
